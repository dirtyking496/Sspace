name: SSPACE V35.2 build verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V35.2 source archive
        run: |
          ARCHIVE="SSPACE_V35.2_NEON_ORBIT.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Missing $ARCHIVE in repository root. Upload the V35.2 archive first."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ARCHIVE" -d project
          ROOT=$(find project -name package.json -not -path '*/messenger/*' -not -path '*/backend/*' -print -quit | xargs dirname)
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/package.json" ]; then
            echo "::error::Could not locate the V35.2 root package.json"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('project/**/package-lock.json', 'project/**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install
        run: npm install --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
        working-directory: ${{ env.PROJECT_ROOT }}
      - name: Build
        run: npm run build
        working-directory: ${{ env.PROJECT_ROOT }}
