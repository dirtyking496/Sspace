<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Alunissage (Lunar Lander)</title>
    <style>
        body { margin: 0; background: #080a0f; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { border: 2px solid #ffa502; background: #0f131c; box-shadow: 0 0 20px #ffa50233; }
        h1 { margin-bottom: 5px; color: #ffa502; text-transform: uppercase; letter-spacing: 2px; }
        p { margin-top: 0; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Alunissage</h1>
    <p>Flèche Haut : propulseur • Gauche/Droite : orientation • Posez-vous doucement sur la zone verte</p>
    <canvas id="game" width="600" height="500"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const keys = {};
        let lander, pad, status;

        function init() {
            lander = { x: 100, y: 60, vx: 1.2, vy: 0, fuel: 100, w: 24, h: 24 };
            pad = { x: 350 + Math.random() * 140, y: 460, w: 80, h: 10 };
            status = 'playing';
        }
        init();

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Enter' && status !== 'playing') init();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (status !== 'playing') return;
            lander.vy += 0.03; // Gravity

            if (keys['ArrowUp'] && lander.fuel > 0) {
                lander.vy -= 0.08;
                lander.fuel = Math.max(0, lander.fuel - 0.35);
            }
            if (keys['ArrowLeft'] && lander.fuel > 0) {
                lander.vx -= 0.04;
                lander.fuel = Math.max(0, lander.fuel - 0.15);
            }
            if (keys['ArrowRight'] && lander.fuel > 0) {
                lander.vx += 0.04;
                lander.fuel = Math.max(0, lander.fuel - 0.15);
            }

            lander.x += lander.vx;
            lander.y += lander.vy;

            if (lander.y + lander.h >= pad.y) {
                const onPad = lander.x >= pad.x && (lander.x + lander.w) <= (pad.x + pad.w);
                const softLanding = lander.vy < 1.8 && Math.abs(lander.vx) < 1.2;
                status = (onPad && softLanding) ? 'won' : 'crashed';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 600, 500);
            // Ground
            ctx.fillStyle = '#2f3542';
            ctx.fillRect(0, 460, 600, 40);
            // Landing Pad
            ctx.fillStyle = '#2ed573';
            ctx.fillRect(pad.x, pad.y, pad.w, pad.h);

            // Thruster flame
            if (status === 'playing' && keys['ArrowUp'] && lander.fuel > 0) {
                ctx.fillStyle = '#ff6348';
                ctx.beginPath();
                ctx.moveTo(lander.x + 6, lander.y + lander.h);
                ctx.lineTo(lander.x + 12, lander.y + lander.h + 14);
                ctx.lineTo(lander.x + 18, lander.y + lander.h);
                ctx.fill();
            }

            // Lander
            ctx.fillStyle = '#f1f2f6';
            ctx.fillRect(lander.x, lander.y, lander.w, lander.h);

            // HUD
            ctx.fillStyle = '#fff';
            ctx.font = '15px sans-serif';
            ctx.fillText('Carburant : ' + Math.round(lander.fuel) + '%', 15, 25);
            ctx.fillText('Vitesse verticale : ' + lander.vy.toFixed(2), 15, 45);

            if (status !== 'playing') {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 0, 600, 500);
                ctx.fillStyle = status === 'won' ? '#2ed573' : '#ff4757';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(status === 'won' ? 'ALUNISSAGE RÉUSSI !' : 'CRASH DU MODULE !', 300, 230);
                ctx.fillStyle = '#fff';
                ctx.font = '18px sans-serif';
                ctx.fillText('Appuyez sur Entrée pour rejouer', 300, 270);
                ctx.textAlign = 'left';
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
